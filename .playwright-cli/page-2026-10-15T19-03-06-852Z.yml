  - generic [ref=e4]:
    - heading "Sorting the matrix by direct manipulation" [level=1] [ref=e5]
    - paragraph [ref=e6]: Press on a cell, drag, and release. The pressed cell is highlighted together with its row and column, because they supply the sort keys. Whole rows and whole columns are reordered; the numbers inside a row or column are never rearranged.
    - list [ref=e7]:
      - listitem [ref=e8]: "Drag down / up: reorder the rows by the values in the pressed cell's column (down = ascending, up = descending)."
      - listitem [ref=e9]: "Drag right / left: reorder the columns by the values in the pressed cell's row (right = ascending, left = descending)."
      - listitem [ref=e10]: "Drag diagonally: do both at once. The vertical part sets the row order and the horizontal part sets the column order. Both sorts use the row and column of the cell you originally pressed."
    - paragraph [ref=e11]: The arrow color shows which sort will happen. Darker cells have higher values. Drags shorter than a few pixels are ignored.
